name: Deploy MFE Portfolio

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build all MFEs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all applications
        run: pnpm -r build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mfe-builds
          path: |
            apps/shell/dist
            apps/about-mfe/dist
            apps/contact-mfe/dist
            apps/experience-mfe/dist
            apps/projects-mfe/dist
            apps/resume-mfe/dist
            apps/skills-mfe/dist

  deploy:
    name: Deploy all MFEs
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mfe-builds
          path: apps

      # deployment goes here
